name: Bug or installation problem
description: Report an installation, widget, refresh or display problem without personal data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FordPassWidgets. Fixes and your own coding are welcome.

        This is a public issue. Do not include passwords, tokens, VINs, vehicle/profile binding IDs, account details, locations, raw telemetry, unredacted logs or personal screenshots. Review any diagnostic excerpt before sharing it.

        Report suspected security issues through [private vulnerability reporting](https://github.com/markse123/FordPassWidgets/security/advisories/new), not this form. No real-vehicle or vehicle-control test is required to file a bug.
  - type: input
    id: app_version
    attributes:
      label: FordPassWidgets version
      description: Enter the version shown by the app, or say that installation did not complete.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: iPhone model, iOS version and Scriptable version
      description: Device model and software versions only. Do not include device identifiers.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - Installer
        - Sign-in or vehicle selection
        - Widget display or settings
        - Fetch or confirmed Refresh
        - An already-enabled vehicle control
        - Something else
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and observed result
      description: Describe what you already tried, including the action used and any non-sensitive message. Do not repeat a vehicle command just to reproduce a report.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant vehicle and widget configuration
      description: Optional model/year, powertrain, transmission, account region, widget size/design, units and feature settings. Region means country/market, not your location. Do not include a VIN, account name or widget binding ID.
  - type: textarea
    id: installer_details
    attributes:
      label: Installer storage and failure stage
      description: For installation problems, say whether you chose iCloud Drive or On My iPhone, New installation or Update, and whether failure happened immediately, while downloading or while saving. Do not include private file paths or script contents.
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional reviewed diagnostic excerpt and reading ages
      description: Share only the relevant redacted states, approximate measurement age and request outcome. A successful request does not prove a new measurement. Leave out raw responses, locations, identifiers and personal screenshots.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I reviewed this public report and removed personal information, credentials and raw vehicle data.
          required: true
