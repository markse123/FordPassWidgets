name: Vehicle model testing feedback
description: Share what already works or needs fixing on a Ford model, using reviewed model-level details.
title: "[Model testing]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing a different Ford. Positive results, incomplete readings and synthetic regression fixtures are all useful. PRs and your own coding are welcome.

        Manual vehicle testing is optional. Report observations you already have; this form does not ask you to start a vehicle, apply an electrical load or send any control command. Submitting a report grants no permission to access your account or control your vehicle.

        This issue is public. Never include passwords, tokens, VINs, vehicle/profile binding IDs, account details, locations, raw telemetry, unredacted logs or personal screenshots. For security-sensitive findings, use [private vulnerability reporting](https://github.com/markse123/FordPassWidgets/security/advisories/new).
  - type: input
    id: model
    attributes:
      label: Model year and model
      description: Model-level details only, such as a model year and F-Series, Bronco or Mustang variant. Do not include a VIN or registration.
    validations:
      required: true
  - type: dropdown
    id: powertrain
    attributes:
      label: Powertrain
      options:
        - Gas or diesel
        - Hybrid (HEV)
        - Plug-in hybrid (PHEV)
        - Electric (BEV)
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: transmission
    attributes:
      label: Transmission
      options:
        - Automatic or EV single-speed
        - Manual
        - Unknown
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Ford account region
      description: Country/market or Unknown only. US sign-in is the initial focus; other regions remain unverified. Do not provide an address or coordinates.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: FordPassWidgets, iOS and Scriptable versions
      description: Include the iPhone model if relevant. Do not include device identifiers.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Widget and vehicle settings
      description: Widget size/design, US/Metric and pressure units, selected powertrain/transmission, four or six tire positions, and relevant feature choices. Do not paste a vehicle binding parameter.
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: How were these readings obtained?
      options:
        - Existing cached display only
        - Passive Fetch or cloud-cache read
        - Confirmed Refresh or status request
        - A vehicle control I had already deliberately enabled and used
        - Synthetic or offline testing only
        - Unknown
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected behavior, observed result and available comparison
      description: Separate what works from missing or incorrect readings. Include an approximate dashboard comparison only if already available. For EVs distinguish traction charge from 12V and plugged-in from charging. For Pro Power include its rating and any circuits/load already observed; no new load test is required.
    validations:
      required: true
  - type: textarea
    id: ages
    attributes:
      label: Measurement ages and request outcome
      description: Give approximate reading ages, the status-request outcome and whether the sample time was unknown. Say Unknown if unavailable. A recent fetch or command result is not necessarily a new measurement.
    validations:
      required: true
  - type: textarea
    id: support_report
    attributes:
      label: Optional reviewed Model support report excerpt
      description: Troubleshooting → Model support report uses cached redacted data, sends no command and uploads nothing. Review it and paste only relevant sections. Exclude identifiers, model binding parameters, locations, raw payloads and personal screenshots. Exact timestamps can be omitted in favor of approximate ages.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I reviewed this public report and removed personal information, credentials and raw vehicle data.
          required: true
