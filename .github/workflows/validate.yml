name: Validate widget and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Verify version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 source/check-tag.py "$RELEASE_TAG"
      - name: Verify generated README before building
        run: python3 source/readme.py --check
      - name: Verify deterministic build
        run: |
          python3 source/build.py
          git diff --exit-code -- "FordPassWidgets.js" source/build-manifest.json README.md
          node --input-type=module --check < "FordPassWidgets.js"
      - name: Run offline regressions
        run: |
          node --test tests/*.test.cjs source/widget.test.cjs
          node source/core.test.cjs
          node source/ui.test.cjs
          node source/parser.test.cjs
      - name: Check documentation links and anchors
        run: python3 source/check-doc-links.py
      - name: Verify release version and immutable installer pin
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* && -n "$BASE_COMMIT" && "$BASE_COMMIT" != "0000000000000000000000000000000000000000" ]]; then
            python3 source/release.py --check --base "$BASE_COMMIT"
          else
            python3 source/release.py --check
          fi
